<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Process Mining Studio</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #0f1117;
        color: #e2e8f0;
        min-height: 100vh;
      }
      #app {
        display: grid;
        grid-template-rows: 48px 1fr;
        height: 100vh;
      }

      /* Topbar */
      #topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        background: #1a1d2e;
        border-bottom: 1px solid #2d3148;
        flex-shrink: 0;
      }
      #topbar h1 {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }
      #topbar .sep {
        flex: 1;
      }
      .topbar-file-btn {
        font-size: 11px;
        color: #9ca3af;
        cursor: pointer;
        white-space: nowrap;
      }

      /* Main layout */
      #main {
        display: grid;
        grid-template-columns: 260px 1fr 300px;
        overflow: hidden;
        min-height: 0;
      }

      /* Panels */
      .panel {
        border-right: 1px solid #2d3148;
        overflow-y: auto;
        padding: 12px;
      }
      .panel h2 {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #6b7280;
        margin-bottom: 8px;
      }
      .panel-right {
        border-right: none;
        border-left: 1px solid #2d3148;
      }
      hr.sep {
        border: none;
        border-top: 1px solid #2d3148;
        margin: 14px 0;
      }

      /* Canvas area */
      #canvas-area {
        position: relative;
        overflow: hidden;
        background: #0a0c14;
        display: flex;
        flex-direction: column;
      }
      #canvas-tabs {
        display: flex;
        gap: 4px;
        padding: 8px 10px;
        background: #0a0c14;
        border-bottom: 1px solid #2d3148;
        flex-shrink: 0;
        z-index: 10;
      }
      .tab-btn {
        padding: 4px 12px;
        border-radius: 4px;
        border: 1px solid #2d3148;
        background: #1a1d2e;
        color: #a0aec0;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .tab-btn:hover {
        border-color: #3b82f6;
        color: #e2e8f0;
      }
      .tab-btn.active {
        background: #3b82f6;
        color: #fff;
        border-color: #3b82f6;
      }

      /* Tab content */
      .tab-content {
        display: none;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .tab-content.active {
        display: flex;
        flex-direction: column;
      }

      /* Graph tab */
      #tab-graph {
        position: relative;
      }
      #graph-viewport {
        flex: 1;
        overflow: hidden;
        cursor: grab;
        position: relative;
      }
      #graph-viewport.grabbing {
        cursor: grabbing;
      }
      #graph-canvas {
        transform-origin: 0 0;
        will-change: transform;
        /* SVG is vector — tell the browser not to apply any smoothing filter */
        image-rendering: crisp-edges;
        image-rendering: -webkit-optimize-contrast; /* Safari */
      }
      #graph-canvas svg {
        display: block;
        /* Never let CSS constrain the SVG size — it must render at its explicit px dimensions */
        max-width: none;
        max-height: none;
        overflow: visible;
      }
      #zoom-controls {
        position: absolute;
        bottom: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        z-index: 5;
      }
      #zoom-controls button {
        width: 28px;
        height: 28px;
        border-radius: 4px;
        border: 1px solid #2d3148;
        background: #1a1d2e;
        color: #e2e8f0;
        font-size: 14px;
        cursor: pointer;
        line-height: 1;
      }
      #zoom-controls button:hover {
        background: #2d3148;
      }
      #layout-reason {
        position: absolute;
        bottom: 12px;
        left: 12px;
        font-size: 10px;
        color: #4b5563;
        pointer-events: none;
      }
      #graph-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #4b5563;
        font-size: 14px;
      }

      /* Table tab */
      #tab-table {
        flex-direction: column;
      }
      .table-toolbar {
        display: flex;
        gap: 8px;
        padding: 8px 12px;
        flex-shrink: 0;
        border-bottom: 1px solid #2d3148;
        align-items: center;
      }
      .table-toolbar span {
        font-size: 11px;
        color: #6b7280;
        margin-left: auto;
      }
      #table-container {
        flex: 1;
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
      }
      th {
        position: sticky;
        top: 0;
        background: #1a1d2e;
        padding: 6px 10px;
        text-align: left;
        color: #9ca3af;
        font-weight: 600;
        border-bottom: 1px solid #2d3148;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
      }
      th:hover {
        color: #e2e8f0;
      }
      th .sort-icon {
        margin-left: 4px;
        opacity: 0.4;
      }
      th.sorted .sort-icon {
        opacity: 1;
      }
      td {
        padding: 4px 10px;
        border-bottom: 1px solid #111827;
        white-space: nowrap;
      }
      tr:hover td {
        background: #1a1d2e;
      }
      .table-empty {
        padding: 24px;
        color: #4b5563;
        text-align: center;
        font-size: 13px;
      }

      /* Benchmark tab */
      #tab-benchmark {
        overflow-y: auto;
        padding: 12px;
      }
      .bench-lib {
        margin-bottom: 16px;
      }
      .bench-lib-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .bench-lib-header h3 {
        font-size: 13px;
        font-weight: 700;
      }
      .bench-lib-count {
        font-size: 10px;
        color: #6b7280;
      }
      .func-card {
        background: #1a1d2e;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 6px;
        border: 1px solid transparent;
        transition: border-color 0.15s;
      }
      .func-card:hover {
        border-color: #2d3148;
      }
      .func-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .func-name {
        font-size: 11px;
        font-weight: 600;
        font-family: monospace;
        color: #34d399;
      }
      .func-category {
        font-size: 9px;
        color: #6b7280;
        background: #0f1117;
        padding: 1px 5px;
        border-radius: 3px;
      }
      .func-badge {
        font-size: 9px;
        padding: 2px 7px;
        border-radius: 9px;
      }
      .badge-callable {
        background: #065f46;
        color: #6ee7b7;
      }
      .badge-uncallable {
        background: #3f1a1a;
        color: #fca5a5;
      }
      .func-desc {
        font-size: 11px;
        color: #9ca3af;
        margin: 5px 0 0;
        line-height: 1.5;
      }
      .func-warn {
        font-size: 10px;
        color: #6b7280;
        margin-top: 3px;
      }
      .func-snippet {
        font-size: 10px;
        color: #9ca3af;
        background: #0a0c14;
        padding: 6px 8px;
        border-radius: 4px;
        margin-top: 6px;
        overflow-x: auto;
        white-space: pre;
      }
      .func-actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        align-items: center;
      }
      .func-result {
        margin-top: 6px;
        font-size: 10px;
        background: #0a0c14;
        padding: 6px 8px;
        border-radius: 4px;
        color: #6ee7b7;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 120px;
        overflow-y: auto;
        display: none;
      }
      .func-result.show {
        display: block;
      }
      .func-result.error {
        color: #fca5a5;
      }

      /* Controls */
      .ctrl-group {
        margin-bottom: 12px;
      }
      .ctrl-group label {
        display: block;
        font-size: 11px;
        color: #9ca3af;
        margin-bottom: 3px;
      }
      select,
      input[type="text"],
      input[type="number"] {
        width: 100%;
        padding: 5px 8px;
        border-radius: 4px;
        border: 1px solid #2d3148;
        background: #0f1117;
        color: #e2e8f0;
        font-size: 12px;
      }
      select:focus,
      input:focus {
        outline: none;
        border-color: #3b82f6;
      }
      button {
        padding: 6px 12px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        font-size: 12px;
      }
      .btn-primary {
        background: #3b82f6;
        color: #fff;
      }
      .btn-primary:hover {
        background: #2563eb;
      }
      .btn-sm {
        padding: 3px 8px;
        font-size: 11px;
      }
      .btn-outline {
        background: transparent;
        border: 1px solid #2d3148;
        color: #a0aec0;
      }
      .btn-outline:hover {
        border-color: #4b5563;
        color: #e2e8f0;
      }
      .btn-green {
        background: #059669;
        color: #fff;
      }
      .btn-green:hover {
        background: #047857;
      }

      /* Stats */
      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .stat-card {
        background: #1a1d2e;
        border-radius: 6px;
        padding: 8px;
      }
      .stat-label {
        font-size: 10px;
        color: #6b7280;
      }
      .stat-value {
        font-size: 16px;
        font-weight: 700;
      }

      /* Toast */
      #toast {
        position: fixed;
        bottom: 16px;
        right: 16px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        max-width: 360px;
      }
      #toast.show {
        opacity: 1;
      }

      /* Loader */
      #loader {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        align-items: center;
        justify-content: center;
        font-size: 13px;
        z-index: 100;
        flex-direction: column;
        gap: 8px;
      }
      #loader.show {
        display: flex;
      }
      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #2d3148;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Topbar -->
      <div id="topbar">
        <h1>⚙ Process Mining Studio</h1>
        <div class="sep"></div>
        <label class="topbar-file-btn">
          <input
            type="file"
            id="file-input"
            accept=".xes,.yaml,.yml,.json,.txt,.csv,.adjlist,.edgelist,.gml,.graphml,.gexf,.net,.paj"
            style="display: none"
          />
          📂 Load Graph
        </label>
        <span
          id="file-badge"
          style="
            font-size: 11px;
            color: #6b7280;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          "
        ></span>
        <button class="btn-sm btn-outline" onclick="downloadSVG()">
          ↓ SVG
        </button>
        <button class="btn-sm btn-outline" onclick="downloadExport()">
          ↓ Export
        </button>
      </div>

      <div id="main">
        <!-- LEFT panel -->
        <div class="panel" id="panel-left">
          <h2>Discovery</h2>
          <div class="ctrl-group">
            <label>Graph Type</label>
            <select id="graph-type">
              <option value="dfg">Directly-Follows Graph</option>
              <option value="petri_net">Petri Net</option>
              <option value="process_tree">Process Tree</option>
              <option value="bpmn">BPMN</option>
            </select>
          </div>
          <div class="ctrl-group">
            <label>Miner</label>
            <select id="miner">
              <option value="alpha">Alpha Miner</option>
              <option value="inductive">Inductive Miner</option>
            </select>
          </div>
          <div class="ctrl-group">
            <label>Layout Override</label>
            <select id="layout-override">
              <option value="">Auto (recommended)</option>
              <option value="spring_layout">Spring (force-directed)</option>
              <option value="kamada_kawai_layout">Kamada-Kawai</option>
              <option value="spectral_layout">Spectral</option>
              <option value="shell_layout">Shell</option>
              <option value="circular_layout">Circular</option>
              <option value="planar_layout">Planar</option>
              <option value="dot_layout">Hierarchical (dot)</option>
            </select>
          </div>
          <button class="btn-primary" style="width: 100%" onclick="discover()">
            ▶ Discover
          </button>

          <hr class="sep" />

          <h2>Filter</h2>
          <div class="ctrl-group">
            <label>Mode</label>
            <select id="filter-mode" onchange="toggleFilterMode()">
              <option value="frequency">By Frequency</option>
              <option value="attribute">By Attribute</option>
            </select>
          </div>
          <div id="filter-freq">
            <div class="ctrl-group">
              <label>Min Frequency</label>
              <input type="number" id="min-freq" value="1" min="0" step="1" />
            </div>
            <div class="ctrl-group">
              <label>Frequency Attribute</label>
              <input type="text" id="freq-attr" value="frequency" />
            </div>
          </div>
          <div id="filter-attr" style="display: none">
            <div class="ctrl-group">
              <label>Target</label>
              <select id="attr-target">
                <option value="edge">Edges</option>
                <option value="node">Nodes</option>
              </select>
            </div>
            <div class="ctrl-group">
              <label>Attribute Name</label>
              <input type="text" id="attr-name" placeholder="e.g. weight" />
            </div>
            <div class="ctrl-group">
              <label>Operator</label>
              <select id="attr-op">
                <option value="eq">= (equals)</option>
                <option value="neq">≠ (not equals)</option>
                <option value="gt">&gt; (greater)</option>
                <option value="lt">&lt; (less)</option>
                <option value="gte">≥</option>
                <option value="lte">≤</option>
                <option value="contains">contains</option>
              </select>
            </div>
            <div class="ctrl-group">
              <label>Value</label>
              <input
                type="text"
                id="attr-value"
                placeholder="value to compare"
              />
            </div>
            <div class="ctrl-group">
              <label>Action</label>
              <select id="attr-keep">
                <option value="keep">Keep matching</option>
                <option value="remove">Remove matching</option>
              </select>
            </div>
          </div>
          <button
            class="btn-outline"
            style="width: 100%; margin-bottom: 6px"
            onclick="applyFilter()"
          >
            Apply Filter
          </button>

          <hr class="sep" />

          <h2>Reduction</h2>
          <div class="ctrl-group">
            <label>Algorithm</label>
            <select id="reduce-algo"></select>
          </div>
          <div id="reduce-params"></div>
          <button
            class="btn-outline"
            style="width: 100%"
            onclick="applyReduction()"
          >
            Apply Reduction
          </button>
        </div>

        <!-- CENTER canvas -->
        <div id="canvas-area">
          <div id="canvas-tabs">
            <button class="tab-btn active" onclick="setTab('graph')">
              Graph
            </button>
            <button class="tab-btn" onclick="setTab('table')">Table</button>
            <button class="tab-btn" onclick="setTab('benchmark')">
              Benchmark
            </button>
          </div>

          <!-- Graph tab -->
          <div id="tab-graph" class="tab-content active">
            <div id="graph-viewport">
              <div id="graph-canvas">
                <div id="graph-placeholder">Load a graph file to begin</div>
              </div>
              <div id="zoom-controls">
                <button onclick="zoom(1.25)" title="Zoom in">+</button>
                <button
                  onclick="resetZoom()"
                  title="Reset zoom"
                  style="font-size: 10px"
                >
                  ⟳
                </button>
                <button onclick="zoom(0.8)" title="Zoom out">−</button>
              </div>
              <div id="layout-reason"></div>
            </div>
          </div>

          <!-- Table tab -->
          <div id="tab-table" class="tab-content">
            <div class="table-toolbar">
              <button
                class="btn-sm btn-outline"
                id="btn-edge-table"
                onclick="loadTable('edge')"
                style="border-color: #3b82f6; color: #60a5fa"
              >
                Edges
              </button>
              <button
                class="btn-sm btn-outline"
                id="btn-node-table"
                onclick="loadTable('node')"
              >
                Nodes
              </button>
              <input
                type="text"
                id="table-search"
                placeholder="Search rows…"
                style="width: 160px; padding: 3px 7px; font-size: 11px"
                oninput="filterTable()"
              />
              <span id="table-count"></span>
            </div>
            <div id="table-container">
              <div class="table-empty">
                Load a graph first, then click Edges or Nodes.
              </div>
            </div>
          </div>

          <!-- Benchmark tab -->
          <div id="tab-benchmark" class="tab-content">
            <div id="benchmark-content" style="padding: 4px 0">
              <div class="table-empty">Loading catalogue…</div>
            </div>
          </div>

          <div id="loader">
            <div class="spinner"></div>
            <span id="loader-msg">Working…</span>
          </div>
        </div>

        <!-- RIGHT stats panel -->
        <div class="panel panel-right" id="panel-right">
          <h2>Graph Info</h2>
          <div class="stat-grid">
            <div class="stat-card">
              <div class="stat-label">Nodes</div>
              <div class="stat-value" id="s-nodes">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Edges</div>
              <div class="stat-value" id="s-edges">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Density</div>
              <div class="stat-value" id="s-density">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Avg Degree</div>
              <div class="stat-value" id="s-avgdeg">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Components</div>
              <div class="stat-value" id="s-comp">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">DAG?</div>
              <div class="stat-value" id="s-dag">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Clustering</div>
              <div class="stat-value" id="s-clust">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Diameter</div>
              <div class="stat-value" id="s-diam">—</div>
            </div>
          </div>
          <hr class="sep" />
          <h2>Loaded File</h2>
          <div
            id="file-info"
            style="font-size: 11px; color: #9ca3af; line-height: 1.9"
          ></div>
          <hr class="sep" />
          <h2>Last Action</h2>
          <div
            id="action-log"
            style="
              font-size: 11px;
              color: #9ca3af;
              white-space: pre-wrap;
              line-height: 1.6;
            "
          ></div>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <script>
      // ═══════════════════════════════════════════════════════════
      //  State
      // ═══════════════════════════════════════════════════════════
      const S = {
        tab: "graph",
        graphLoaded: false,
        // SVG natural dimensions (set after each renderSVG call)
        svgW: 800,
        svgH: 600,
        // zoom / pan
        scale: 1,
        tx: 0,
        ty: 0,
        panning: false,
        startX: 0,
        startY: 0,
        startTx: 0,
        startTy: 0,
        // table
        tableData: null, // {columns, rows}
        tableSort: { col: null, dir: 1 },
      };

      // ═══════════════════════════════════════════════════════════
      //  Init
      // ═══════════════════════════════════════════════════════════
      document.addEventListener("DOMContentLoaded", () => {
        document
          .getElementById("file-input")
          .addEventListener("change", handleFileUpload);
        loadAlgorithms();
        loadBenchmarkCatalogue();
        initZoomPan();
      });

      // ═══════════════════════════════════════════════════════════
      //  Tabs
      // ═══════════════════════════════════════════════════════════
      function setTab(name) {
        S.tab = name;
        const names = ["graph", "table", "benchmark"];
        names.forEach((t) => {
          document
            .getElementById(`tab-${t}`)
            .classList.toggle("active", t === name);
        });
        document.querySelectorAll(".tab-btn").forEach((b, i) => {
          b.classList.toggle("active", names[i] === name);
        });
      }

      // ═══════════════════════════════════════════════════════════
      //  Upload
      // ═══════════════════════════════════════════════════════════
      async function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        showLoader(true, `Loading ${file.name}…`);
        const fd = new FormData();
        fd.append("file", file);
        try {
          const r = await fetch("/api/upload/file", {
            method: "POST",
            body: fd,
          });
          const text = await r.text();
          let d;
          try {
            d = JSON.parse(text);
          } catch {
            toast("Server error — non-JSON response. Check terminal.", "error");
            return;
          }
          if (!d.ok) {
            console.error("Upload detail:", d.detail || d.error);
            toast("Upload error: " + d.error, "error");
            return;
          }
          S.graphLoaded = true;
          document.getElementById("file-badge").textContent =
            `${d.filename} (${d.source_format}→${d.export_format})`;
          document.getElementById("file-info").innerHTML =
            `<b>Name:</b> ${d.filename}<br><b>Format:</b> ${d.source_format}<br>` +
            `<b>Export:</b> ${d.export_format}<br><b>EventLog:</b> ${d.has_log}`;
          updateStats(d.stats);
          toast(`Loaded — ${d.stats.nodes} nodes, ${d.stats.edges} edges`);
        } catch (err) {
          toast("Upload failed: " + err.message, "error");
        } finally {
          showLoader(false);
          e.target.value = ""; // allow re-uploading the same file
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  Discovery
      // ═══════════════════════════════════════════════════════════
      async function discover() {
        showLoader(true, "Discovering…");
        const body = {
          graph_type: document.getElementById("graph-type").value,
          miner: document.getElementById("miner").value,
          layout: document.getElementById("layout-override").value || null,
        };
        try {
          const r = await fetch("/api/graph/discover", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const text = await r.text();
          let d;
          try {
            d = JSON.parse(text);
          } catch {
            toast("Server error — non-JSON. Check terminal.", "error");
            return;
          }

          if (d.stub || !d.ok) {
            console.error("Discovery detail:", d.detail || d.stub_reason);
            logAction("Discovery failed:\n" + d.stub_reason);
            toast(d.stub_reason, "warn");
          } else if (d.svg) {
            renderSVG(d.svg);
            setTab("graph");
            const ly = d.layout || {};
            document.getElementById("layout-reason").textContent =
              ly.layout_name ? `Layout: ${ly.layout_name} — ${ly.reason}` : "";
            logAction(
              `Discovered: ${d.type} (${body.miner})\nLayout: ${ly.layout_name || "n/a"}`,
            );
          }
        } catch (err) {
          toast("Discovery failed: " + err.message, "error");
        } finally {
          showLoader(false);
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  SVG rendering
      // ═══════════════════════════════════════════════════════════
      function renderSVG(b64) {
        const canvas = document.getElementById("graph-canvas");
        canvas.innerHTML = atob(b64);
        const svg = canvas.querySelector("svg");
        if (!svg) return;

        // Read natural dimensions from viewBox or existing width/height attrs.
        // Then fix the SVG at those exact pixel dimensions so the browser
        // always renders it at full resolution — blurriness only occurs when
        // the SVG is scaled by CSS without explicit pixel dimensions.
        let svgW = 0,
          svgH = 0;
        const vb = svg.viewBox && svg.viewBox.baseVal;
        if (vb && vb.width > 0) {
          svgW = vb.width;
          svgH = vb.height;
        } else {
          // Fallback: read width/height attrs (may be "pt" units from graphviz)
          svgW = parsePt(svg.getAttribute("width")) || 800;
          svgH = parsePt(svg.getAttribute("height")) || 600;
          // If no viewBox, create one so the SVG scales properly
          if (!vb || !vb.width) {
            svg.setAttribute("viewBox", `0 0 ${svgW} ${svgH}`);
          }
        }

        // Set explicit pixel size — SVG now always renders at native resolution.
        // Zoom/pan moves the canvas div; the SVG pixel size never changes.
        svg.setAttribute("width", svgW);
        svg.setAttribute("height", svgH);
        svg.style.display = "block";
        svg.style.shapeRendering = "geometricPrecision";
        svg.style.textRendering = "optimizeLegibility";

        S.svgW = svgW;
        S.svgH = svgH;
        resetZoom();
      }

      function parsePt(val) {
        // Graphviz emits dimensions like "612pt" — convert to px (1pt = 1.333px)
        if (!val) return 0;
        const m = String(val).match(/^([\d.]+)(pt|px)?$/);
        if (!m) return 0;
        return m[2] === "pt"
          ? Math.round(parseFloat(m[1]) * 1.3333)
          : parseFloat(m[1]);
      }

      // ═══════════════════════════════════════════════════════════
      //  Zoom / Pan
      // ═══════════════════════════════════════════════════════════
      function initZoomPan() {
        const vp = document.getElementById("graph-viewport");

        // Ctrl+Scroll to zoom toward cursor
        vp.addEventListener(
          "wheel",
          (e) => {
            if (!e.ctrlKey) return;
            e.preventDefault();
            const rect = vp.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
            applyZoom(factor, mouseX, mouseY);
          },
          { passive: false },
        );

        // Also plain scroll (no ctrl) zooms — matches most graph tools
        vp.addEventListener(
          "wheel",
          (e) => {
            if (e.ctrlKey) return;
            e.preventDefault();
            const rect = vp.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
            applyZoom(factor, mouseX, mouseY);
          },
          { passive: false },
        );

        // Drag to pan
        vp.addEventListener("mousedown", (e) => {
          if (e.button !== 0) return;
          S.panning = true;
          S.startX = e.clientX;
          S.startY = e.clientY;
          S.startTx = S.tx;
          S.startTy = S.ty;
          vp.classList.add("grabbing");
        });
        window.addEventListener("mousemove", (e) => {
          if (!S.panning) return;
          S.tx = S.startTx + (e.clientX - S.startX);
          S.ty = S.startTy + (e.clientY - S.startY);
          applyTransform();
        });
        window.addEventListener("mouseup", () => {
          S.panning = false;
          document
            .getElementById("graph-viewport")
            .classList.remove("grabbing");
        });
      }

      function applyZoom(factor, originX, originY) {
        const vp = document.getElementById("graph-viewport");
        if (originX == null) {
          originX = vp.clientWidth / 2;
          originY = vp.clientHeight / 2;
        }
        const newScale = Math.min(Math.max(S.scale * factor, 0.02), 30);
        // Adjust translation so the point under the cursor stays fixed
        S.tx = originX - (originX - S.tx) * (newScale / S.scale);
        S.ty = originY - (originY - S.ty) * (newScale / S.scale);
        S.scale = newScale;
        applyTransform();
      }

      function zoom(factor) {
        applyZoom(factor, null, null);
      }

      function resetZoom() {
        const vp = document.getElementById("graph-viewport");
        const vpW = vp.clientWidth || 800;
        const vpH = vp.clientHeight || 600;
        const svgW = S.svgW || 800;
        const svgH = S.svgH || 600;

        // Scale to fit with 4% padding, but never exceed 1:1
        S.scale = Math.min(vpW / svgW, vpH / svgH) * 0.96;
        // Centre the SVG in the viewport
        S.tx = (vpW - svgW * S.scale) / 2;
        S.ty = (vpH - svgH * S.scale) / 2;
        applyTransform();
      }

      function applyTransform() {
        // transform-origin:0 0 means tx/ty are in screen pixels,
        // scale is applied after translation — SVG pixels are unaffected.
        document.getElementById("graph-canvas").style.transform =
          `translate(${S.tx}px,${S.ty}px) scale(${S.scale})`;
      }

      // ═══════════════════════════════════════════════════════════
      //  Filter
      // ═══════════════════════════════════════════════════════════
      function toggleFilterMode() {
        const mode = document.getElementById("filter-mode").value;
        document.getElementById("filter-freq").style.display =
          mode === "frequency" ? "" : "none";
        document.getElementById("filter-attr").style.display =
          mode === "attribute" ? "" : "none";
      }

      async function applyFilter() {
        const mode = document.getElementById("filter-mode").value;
        const body = { mode };
        if (mode === "frequency") {
          body.min_frequency = parseFloat(
            document.getElementById("min-freq").value,
          );
          body.frequency_attr = document.getElementById("freq-attr").value;
        } else {
          body.target = document.getElementById("attr-target").value;
          body.attribute = document.getElementById("attr-name").value;
          body.operator = document.getElementById("attr-op").value;
          body.value = document.getElementById("attr-value").value;
          body.keep_matching =
            document.getElementById("attr-keep").value === "keep";
        }
        showLoader(true, "Filtering…");
        try {
          const r = await fetch("/api/graph/filter", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const d = await r.json();
          if (!d.ok) {
            toast("Filter error: " + d.error, "error");
            return;
          }
          updateStats(d.stats);
          logAction("Filter applied (" + mode + ")\n" + d.message);
          toast(d.message);
        } finally {
          showLoader(false);
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  Reduction
      // ═══════════════════════════════════════════════════════════
      async function loadAlgorithms() {
        try {
          const r = await fetch("/api/graph/algorithms");
          const d = await r.json();
          const sel = document.getElementById("reduce-algo");
          d.algorithms.forEach((a) => {
            const opt = document.createElement("option");
            opt.value = a.id;
            opt.textContent = a.name;
            opt.title = a.description;
            sel.appendChild(opt);
          });
        } catch {}
      }

      async function applyReduction() {
        const algo = document.getElementById("reduce-algo").value;
        if (!algo) return;
        showLoader(true, "Reducing…");
        try {
          const r = await fetch("/api/graph/reduce", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ algorithm_id: algo, params: {} }),
          });
          const d = await r.json();
          if (!d.ok) {
            toast("Reduction error: " + d.error, "error");
            return;
          }
          updateStats(d.stats);
          logAction("Reduction applied: " + algo);
          toast("Reduction applied.");
        } finally {
          showLoader(false);
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  Table
      // ═══════════════════════════════════════════════════════════
      async function loadTable(target) {
        // Toggle button styles
        document.getElementById("btn-edge-table").style.cssText =
          target === "edge" ? "border-color:#3b82f6;color:#60a5fa" : "";
        document.getElementById("btn-node-table").style.cssText =
          target === "node" ? "border-color:#3b82f6;color:#60a5fa" : "";

        showLoader(true, "Loading table…");
        try {
          const r = await fetch(`/api/graph/table?target=${target}`);
          const d = await r.json();
          if (!d.ok) {
            toast(d.error, "error");
            return;
          }
          S.tableData = d.table;
          S.tableSort = { col: null, dir: 1 };
          renderTable(S.tableData.rows);
        } catch (err) {
          toast("Table error: " + err.message, "error");
        } finally {
          showLoader(false);
        }
      }

      function renderTable(rows) {
        if (!S.tableData) return;
        const { columns } = S.tableData;
        const search = document
          .getElementById("table-search")
          .value.toLowerCase();
        const filtered = search
          ? rows.filter((r) =>
              columns.some((c) =>
                String(r[c] ?? "")
                  .toLowerCase()
                  .includes(search),
              ),
            )
          : rows;

        document.getElementById("table-count").textContent =
          `${filtered.length} rows`;

        if (!filtered.length) {
          document.getElementById("table-container").innerHTML =
            '<div class="table-empty">No rows match.</div>';
          return;
        }

        const ths = columns
          .map((c) => {
            const sorted = S.tableSort.col === c;
            const icon = sorted ? (S.tableSort.dir === 1 ? " ▲" : " ▼") : " ⇅";
            return `<th class="${sorted ? "sorted" : ""}" onclick="sortTable('${c}')">${c}<span class="sort-icon">${icon}</span></th>`;
          })
          .join("");

        const trs = filtered
          .map(
            (row) =>
              "<tr>" +
              columns.map((c) => `<td>${row[c] ?? ""}</td>`).join("") +
              "</tr>",
          )
          .join("");

        document.getElementById("table-container").innerHTML =
          `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
      }

      function filterTable() {
        if (!S.tableData) return;
        renderTable(getSortedRows());
      }

      function sortTable(col) {
        if (S.tableSort.col === col) S.tableSort.dir *= -1;
        else {
          S.tableSort.col = col;
          S.tableSort.dir = 1;
        }
        renderTable(getSortedRows());
      }

      function getSortedRows() {
        if (!S.tableData) return [];
        const rows = [...S.tableData.rows];
        const { col, dir } = S.tableSort;
        if (!col) return rows;
        return rows.sort((a, b) => {
          const av = a[col] ?? "",
            bv = b[col] ?? "";
          const an = parseFloat(av),
            bn = parseFloat(bv);
          if (!isNaN(an) && !isNaN(bn)) return (an - bn) * dir;
          return String(av).localeCompare(String(bv)) * dir;
        });
      }

      // ═══════════════════════════════════════════════════════════
      //  Benchmark
      // ═══════════════════════════════════════════════════════════
      async function loadBenchmarkCatalogue() {
        try {
          const r = await fetch("/api/benchmark/catalogue");
          const d = await r.json();
          renderCatalogue(d.catalogue);
        } catch {}
      }

      function renderCatalogue(cat) {
        const libColors = {
          pm4py: "#60a5fa",
          bupar: "#34d399",
          "bpmn-js": "#f59e0b",
          mp4js: "#a78bfa",
        };
        let html = "";
        for (const [lib, funcs] of Object.entries(cat)) {
          const color = libColors[lib] || "#60a5fa";
          html += `<div class="bench-lib">
      <div class="bench-lib-header">
        <h3 style="color:${color}">${lib}</h3>
        <span class="bench-lib-count">${funcs.length} functions</span>
      </div>`;
          funcs.forEach((fn) => {
            const badge = fn.callable
              ? `<span class="func-badge badge-callable">callable</span>`
              : `<span class="func-badge badge-uncallable">JS/R only</span>`;
            html += `<div class="func-card" id="card-${fn.id}">
        <div class="func-card-header">
          <span class="func-name">${fn.name}</span>
          <span class="func-category">${fn.category}</span>
          ${badge}
        </div>
        <div class="func-desc">${fn.description}</div>
        ${fn.stub_reason ? `<div class="func-warn">⚠ ${fn.stub_reason}</div>` : ""}
        ${fn.js_snippet ? `<div class="func-snippet">${escHtml(fn.js_snippet)}</div>` : ""}
        <div class="func-actions">
          ${
            fn.callable
              ? `<button class="btn-sm btn-green" onclick="callFunction('${lib}','${fn.id}')">▶ Call</button>`
              : ""
          }
          <button class="btn-sm btn-outline" onclick="nativeView('${lib}')">Native View</button>
        </div>
        <div class="func-result" id="result-${fn.id}"></div>
      </div>`;
          });
          html += "</div>";
        }
        document.getElementById("benchmark-content").innerHTML = html;
      }

      async function callFunction(lib, funcId) {
        const resultEl = document.getElementById(`result-${funcId}`);
        resultEl.textContent = "Calling…";
        resultEl.className = "func-result show";
        try {
          const r = await fetch("/api/benchmark/call", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ library: lib, func_id: funcId, params: {} }),
          });
          const d = await r.json();
          if (d.error) {
            resultEl.textContent = "Error: " + d.error;
            resultEl.className = "func-result show error";
          } else {
            resultEl.textContent = JSON.stringify(d.result, null, 2);
            resultEl.className = "func-result show";
          }
        } catch (err) {
          resultEl.textContent = "Request failed: " + err.message;
          resultEl.className = "func-result show error";
        }
      }

      async function nativeView(lib) {
        try {
          const r = await fetch(`/api/benchmark/native-view/${lib}`);
          const d = await r.json();
          if (d.view.type === "iframe") {
            const canvas = document.getElementById("graph-canvas");
            canvas.innerHTML = `<iframe src="${d.view.url}"
        style="width:800px;height:600px;border:1px solid #2d3148;border-radius:4px"></iframe>`;
            S.scale = 1;
            S.tx = 20;
            S.ty = 20;
            applyTransform();
            setTab("graph");
            toast("Opened " + lib + " native view");
          } else {
            toast(d.view.message);
          }
        } catch (err) {
          toast("Native view error: " + err.message, "error");
        }
      }

      function escHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      // ═══════════════════════════════════════════════════════════
      //  Downloads
      // ═══════════════════════════════════════════════════════════
      function downloadSVG() {
        window.location.href = "/api/graph/svg";
      }
      function downloadExport() {
        window.location.href = "/api/graph/export";
      }

      // ═══════════════════════════════════════════════════════════
      //  UI helpers
      // ═══════════════════════════════════════════════════════════
      function updateStats(s) {
        if (!s) return;
        document.getElementById("s-nodes").textContent = s.nodes ?? "—";
        document.getElementById("s-edges").textContent = s.edges ?? "—";
        document.getElementById("s-density").textContent = s.density ?? "—";
        document.getElementById("s-avgdeg").textContent = s.avg_degree ?? "—";
        document.getElementById("s-comp").textContent = s.components ?? "—";
        document.getElementById("s-dag").textContent =
          s.is_dag == null ? "—" : s.is_dag ? "Yes" : "No";
        document.getElementById("s-clust").textContent =
          s.avg_clustering ?? "—";
        document.getElementById("s-diam").textContent = s.diameter ?? "—";
      }

      function logAction(msg) {
        document.getElementById("action-log").textContent = msg;
      }

      function showLoader(show, msg = "Working…") {
        document.getElementById("loader").className = show ? "show" : "";
        document.getElementById("loader-msg").textContent = msg;
      }

      function toast(msg, type = "info") {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.style.borderColor =
          type === "error"
            ? "#ef4444"
            : type === "warn"
              ? "#f59e0b"
              : "#3b82f6";
        el.classList.add("show");
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove("show"), 3500);
      }
    </script>
  </body>
</html>
